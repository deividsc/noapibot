version: '3.8'

services:
  openclaw:
    image: openclaw-openclaw:latest
    # build: .
    container_name: openclaw-container
    ports:
      - "18789:18789"
      - "4096:4096"
    volumes:
      - ./workspace:/root/.openclaw/workspace
      - ./memory:/root/.clawdbot/memory
      - openclaw-data:/root/.clawdbot
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - ANTIGRAVITY_API_KEY=${ANTIGRAVITY_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${ANTIGRAVITY_API_KEY}
      - GEMINI_API_KEY=${ANTIGRAVITY_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST}
      # TELEGRAM_BOT_TOKEN removed — NoApiBot on Windows handles Telegram now
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL}
      - TRACK_COSTS=${TRACK_COSTS}
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  openclaw-data:


